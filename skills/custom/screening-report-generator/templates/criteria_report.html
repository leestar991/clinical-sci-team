<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入排标准解析</title>
<style>
  :root{
    --bg:#f4f6f8;--card:#fff;--ink:#141b23;--muted:#6a7583;--faint:#95a0ad;
    --line:#e4e8ed;--brand:#0f766e;
    --inc:#0f766e;--inc-bg:#ecf6f4;--exc:#b4531b;--exc-bg:#fbefe5;
    --key:#5a6675;--hl:#0b5c55;
    --ok:#12805c;--ok-bg:#e7f6ef;--no:#c0392b;--no-bg:#fdecea;--may:#b8860b;--may-bg:#fbf2dc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px}
  header h1{margin:0 0 4px;font-size:18px;font-weight:800}
  header .sub{color:var(--muted);font-size:13px}
  header .meta{margin-top:6px;font-size:12px;color:var(--faint)}
  .wrap{max-width:1200px;margin:0 auto;padding:16px 24px 64px}

  .bar{position:sticky;top:0;z-index:9;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;
    cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  .search{flex:1;min-width:200px;max-width:340px}
  .search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--card)}
  .prog{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
  .p{padding:3px 9px;border-radius:12px;font-weight:700}
  .p.ok{background:var(--ok-bg);color:var(--ok)}
  .p.no{background:var(--no-bg);color:var(--no)}
  .p.may{background:var(--may-bg);color:var(--may)}
  .p.t{background:var(--line);color:var(--muted)}
  .mini{margin-left:auto;font-size:12px;color:var(--faint);cursor:pointer;border:1px solid var(--line);
    background:var(--card);border-radius:8px;padding:6px 10px}

  .crit{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;
    border-left:4px solid transparent}
  .crit.inc{border-left-color:var(--inc)} .crit.exc{border-left-color:var(--exc)}
  .crithd{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;background:#fafbfc}
  .crithd:hover{background:#f2f7f6}
  .cnum{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:12.5px;color:#fff;
    background:var(--exc);border-radius:6px;padding:2px 8px;white-space:nowrap}
  .crit.inc .cnum{background:var(--inc)}
  .cdesc{font-weight:700;font-size:14px;flex:1}
  .cmeta{font-size:11.5px;color:var(--faint)}
  .caret{color:var(--faint);font-size:12px;transition:transform .2s}
  .crit.open .caret{transform:rotate(90deg)}

  .subs{border-top:1px solid var(--line);display:none}
  .crit.open .subs{display:block}
  .srow{border-top:1px dashed var(--line)}
  .srow:first-child{border-top:none}
  .sline{display:grid;grid-template-columns:52px 1fr auto auto auto;gap:10px;align-items:center;
    padding:9px 14px;cursor:pointer;list-style:none}
  .sline::-webkit-details-marker{display:none}
  .snum{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:12px;color:var(--muted)}
  .stext{font-size:13.5px;font-weight:700;color:var(--ink)}
  .stext .hl{color:var(--hl);font-weight:800}
  .field{font-size:11px;color:var(--muted);background:#eef2f6;border-radius:8px;padding:2px 8px;
    max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .pill.av{background:var(--inc-bg);color:var(--inc)} .pill.na2{background:#fdeaea;color:#b42318}
  .judge{display:flex;gap:4px}
  .jb{border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:11.5px;font-weight:700;
    padding:3px 8px;cursor:pointer;color:var(--muted)}
  .jb.ok[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
  .jb.may[aria-pressed="true"]{background:var(--may);color:#fff;border-color:var(--may)}
  .jb.no[aria-pressed="true"]{background:var(--no);color:#fff;border-color:var(--no)}

  .sdetail{padding:2px 14px 14px 66px;font-size:12.5px;display:none}
  details[open] .sdetail{display:block}
  .raw{color:var(--muted);background:#f6f8fa;border-radius:8px;padding:8px 10px;margin:4px 0}
  .raw b{color:var(--key);font-weight:700}
  .logic{color:var(--faint);margin:6px 0}.logic b{color:var(--muted)}
  .block{margin-top:8px;border:1px solid var(--line);border-radius:8px;background:#fcfdfe}
  .bh{font-size:11px;font-weight:700;color:var(--hl);text-transform:uppercase;letter-spacing:.4px;padding:7px 12px}
  .kvb{padding:0 12px 10px}
  .kvr{display:grid;grid-template-columns:110px 1fr;gap:2px 12px;padding:3px 0;border-top:1px dashed var(--line)}
  .kvr:first-child{border-top:none}
  .kk{color:var(--key);font-weight:600;font-size:12px}.vv{font-size:12.5px}
  .vv .hl{font-weight:700;color:var(--hl)}
  ul.vl{margin:2px 0 0;padding-left:16px} ul.vl li{margin:1px 0}
  .note{color:#875516;background:#fdf5e8;border-left:3px solid #e8b866;border-radius:4px;padding:6px 10px;margin-top:8px}
  .empty{color:var(--muted);padding:24px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px}
  footer{color:var(--faint);font-size:12px;text-align:center;padding:22px}
  @media(max-width:720px){.sline{grid-template-columns:44px 1fr;grid-auto-rows:auto}
    .field,.pill{grid-column:2}.judge{grid-column:2}.sdetail{padding-left:20px}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <div class="meta" id="meta"></div>
</header>
<div class="wrap">
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <div class="search"><input id="q" type="search" placeholder="搜索 子条件 / 原文 / 字段 …" aria-label="搜索"></div>
      <div class="prog" id="prog"></div>
      <button class="mini" id="reset">清除判定</button>
    </div>
  </div>
  <div id="content"></div>
</div>
<footer id="foot"></footer>

<!-- DATA: Replace this with criteria_parsed.json content -->
<script id="data" type="application/json">
{
  "方案元数据": {},
  "解析说明": {},
  "四分类": {
    "入选_可从病例获取": {},
    "入选_不可从病例获取": {},
    "排除_可从病例获取": {},
    "排除_不可从病例获取": {}
  },
  "汇总统计": {},
  "描述索引": {}
}
</script>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const M = DATA.方案元数据, S = DATA.汇总统计, DESC = DATA.描述索引;
// `四分类` 的每个类目是**以 条件ID 为键的对象**（旧 workspace 可能仍是数组，一并兼容）。
// 在这里一次性归一成数组，下面的展示逻辑就不必关心形态。
// ⛔ 同时显式按 条件ID 自然序排序：JSON 对象在格式层面无序，往里加条目也只会落到末尾，
//    所以展示顺序必须由消费方决定，不能依赖容器里的书写顺序。
const groups = {};
for (const k of Object.keys(DATA.四分类 || {})) {
  const v = DATA.四分类[k];
  const arr = Array.isArray(v) ? v.slice() : Object.values(v || {});
  arr.sort((a, b) => {
    const pa = pinfo(String(a && a.条件ID || '')), pb = pinfo(String(b && b.条件ID || ''));
    const na = parseInt(pa.num, 10), nb = parseInt(pb.num, 10);
    if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return na - nb;
    return String(a && a.条件ID || '').localeCompare(String(b && b.条件ID || ''), 'en', {numeric: true});
  });
  groups[k] = arr;
}
const KEYS = ["入选_可从病例获取","排除_可从病例获取","入选_不可从病例获取","排除_不可从病例获取"];
const LABEL = {"入选_可从病例获取":"入选 · 可从病例获取","排除_可从病例获取":"排除 · 可从病例获取",
  "入选_不可从病例获取":"入选 · 不可从病例获取","排除_不可从病例获取":"排除 · 不可从病例获取"};
const LS = "判定_" + (M.方案编号 || 'default');
// localStorage 在沙箱化 iframe / 不透明来源下会抛错，降级为内存态，避免整页空白
const STORE = (() => {
  try { const t = '__t'; window.localStorage.setItem(t, t); window.localStorage.removeItem(t); return window.localStorage; }
  catch (e) { const mem = {}; return {getItem: k => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; }}; }
})();
let JUDGE = JSON.parse(STORE.getItem(LS) || "{}");

document.getElementById('title').textContent = "入排标准解析 · " + (M.方案编号 || '');
document.getElementById('subtitle').textContent = M.方案标题 || '';
document.getElementById('meta').textContent = [
  M.试验药品 ? "试验药品：" + M.试验药品 : '',
  M.版本 ? "版本：" + M.版本 + (M.版本日期 ? " (" + M.版本日期 + ")" : '') : '',
  M.来源 ? "来源：" + M.来源 : ''
].filter(Boolean).join("　|　");
document.getElementById('foot').textContent = (DATA.解析说明.拆分原则 || '') + "　·　" + (DATA.解析说明.日期处理 || '');

let active = "all";
const tabs = [["all","全部"]].concat(KEYS.map(k => [k, LABEL[k] + " (" + (groups[k]||[]).length + ")"]));
const tabsEl = document.getElementById('tabs');
tabsEl.innerHTML = tabs.map(([k,l],i) => `<button class="tab" role="tab" data-k="${k}" aria-selected="${i===0}">${l}</button>`).join('');
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  active = b.dataset.k;
  [...tabsEl.children].forEach(x => x.setAttribute('aria-selected', x === b));
  render();
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('清除全部人工判定？')) { JUDGE = {}; save(); render(); }
});

const esc = s => (s == null ? "" : String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isInc = k => k.startsWith("入选");
function hl(s) { return esc(s).replace(/(≥|≤|＜|＞|&gt;|&lt;|∈|[0-9]+(?:\.[0-9]+)?(?:×?10\^[0-9]+)?)/g, m => `<span class="hl">${m}</span>`); }

function val(v) {
  if (v === null || v === undefined) return '<em style="color:var(--faint)">—</em>';
  if (Array.isArray(v)) return '<ul class="vl">' + v.map(x => `<li>${(x && typeof x === 'object') ? kvBlock(x) : hl(x)}</li>`).join('') + '</ul>';
  if (typeof v === 'object') return kvBlock(v);
  return hl(v);
}
function kvBlock(o) {
  return '<div class="kvb">' + Object.entries(o).map(([k,v]) =>
    `<div class="kvr"><span class="kk">${esc(k)}</span><span class="vv">${val(v)}</span></div>`
  ).join('') + '</div>';
}

function pinfo(id) {
  const m = id.match(/^(IN|EX)-(\d+)(?:-(\d+))?$/);
  if (!m) return {pid: id, cat: '?', num: '?', sub: id};
  return {pid: m[1]+"-"+m[2], cat: m[1]==="IN"?"入选":"排除", num: m[2], sub: m[3] ? m[2]+"."+m[3] : m[2]};
}
function fieldHint(t) {
  if (!t) return "";
  let f = t.匹配字段; if (Array.isArray(f)) f = f.join(" / ");
  let ex = ""; if (t.运算符 && t.阈值 != null) ex = " " + t.运算符 + " " + (Array.isArray(t.阈值)?t.阈值.join(","):t.阈值) + (t.单位||"");
  if (!f && t.或条件) f = "或 " + t.或条件.length + " 项";
  if (!f && t.条件) f = t.条件;
  return f ? (f + ex) : "";
}

function save() { STORE.setItem(LS, JSON.stringify(JUDGE)); }

function subRow(it) {
  const p = pinfo(it.条件ID), j = JUDGE[it.条件ID] || "";
  const pill = it.可从病例获取 ? '<span class="pill av">可获取</span>' : '<span class="pill na2">不可获取</span>';
  const fh = fieldHint(it.转化条件);
  const field = fh ? `<span class="field" title="${esc(fh)}">${esc(fh)}</span>` : '<span></span>';
  let det = '';
  det += `<div class="raw"><b>原文：</b>${esc(it.原文)}</div>`;
  det += `<div class="logic"><b>逻辑：</b>${esc(it.逻辑关系)}</div>`;
  if (it.转化条件) det += `<div class="block"><div class="bh">转化条件 · 病例可匹配</div>${kvBlock(it.转化条件)}</div>`;
  if (it.日期维度) det += `<div class="block"><div class="bh">日期维度</div>${kvBlock(it.日期维度)}</div>`;
  if (it.备注) det += `<div class="note">备注：${esc(it.备注)}</div>`;
  const jb = (cls, lbl) => `<button class="jb ${cls}" data-id="${it.条件ID}" data-v="${lbl}" aria-pressed="${j===lbl}">${lbl}</button>`;
  return `<details class="srow">
    <summary class="sline">
      <span class="snum">${p.sub}</span>
      <span class="stext">${hl(it.子条件)}</span>
      ${field}${pill}
      <span class="judge">${jb('ok','符合')}${jb('may','存疑')}${jb('no','不符合')}</span>
    </summary>
    <div class="sdetail">${det}</div>
  </details>`;
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const keys = active === "all" ? KEYS : [active];
  let html = '';
  keys.forEach(k => {
    const items = groups[k] || [];
    if (!items.length) return;
    // Group by parent criterion
    const byParent = {};
    items.forEach(it => {
      const p = pinfo(it.条件ID);
      if (!byParent[p.pid]) byParent[p.pid] = [];
      byParent[p.pid].push(it);
    });
    const cls = isInc(k) ? 'inc' : 'exc';
    Object.entries(byParent).forEach(([pid, subs]) => {
      // Filter by search
      if (q) {
        const match = subs.some(it =>
          (it.子条件||'').toLowerCase().includes(q) ||
          (it.原文||'').toLowerCase().includes(q) ||
          fieldHint(it.转化条件).toLowerCase().includes(q)
        );
        if (!match) return;
      }
      const desc = DESC[pid] || subs[0].子条件 || '';
      html += `<div class="crit ${cls}">
        <div class="crithd" onclick="this.parentElement.classList.toggle('open')">
          <span class="cnum">${pid}</span>
          <span class="cdesc">${esc(desc)}</span>
          <span class="cmeta">${subs.length} 子条件</span>
          <span class="caret">▶</span>
        </div>
        <div class="subs">${subs.map(subRow).join('')}</div>
      </div>`;
    });
  });
  document.getElementById('content').innerHTML = html || '<div class="empty">无匹配条目</div>';

  // Update progress
  let ok=0, may=0, no=0, t=0;
  KEYS.forEach(k => (groups[k]||[]).forEach(it => {
    t++;
    const j = JUDGE[it.条件ID];
    if (j==='符合') ok++; else if (j==='存疑') may++; else if (j==='不符合') no++;
  }));
  document.getElementById('prog').innerHTML =
    `<span class="p ok">符合 ${ok}</span><span class="p may">存疑 ${may}</span><span class="p no">不符合 ${no}</span><span class="p t">待定 ${t-ok-may-no}</span>`;
}

// Judge button clicks
document.addEventListener('click', e => {
  const btn = e.target.closest('.jb');
  if (!btn) return;
  e.preventDefault(); e.stopPropagation();
  const id = btn.dataset.id, v = btn.dataset.v;
  JUDGE[id] = JUDGE[id] === v ? '' : v;
  save();
  // Update just this row's buttons
  const row = btn.closest('.srow');
  if (row) row.querySelectorAll('.jb').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === JUDGE[id]));
  // Update progress
  render();
});

render();
</script>
</body>
</html>
